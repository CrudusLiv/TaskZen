<section class="page-settings panel-stack">
  <header class="heading panel-glass panel-section">
    <h1>Settings</h1>
    <p class="intro">Your preferences are saved automatically and restored on every visit.</p>
  </header>
  <form class="prefs panel-glass panel-section" (submit)="$event.preventDefault()">
    <fieldset class="group">
      <legend>Interface</legend>
      <label class="inline">
        <input type="checkbox" [checked]="calm()" (change)="toggleCalm()" /> Calm mode
      </label>
      <label>
        <span>Theme Mode</span>
        <div class="accent-swatches" role="radiogroup" aria-label="Accent color choices">
          @for (a of accentPalette; track a) {
            <button
              type="button"
              class="swatch"
              [class.active]="accent() === a"
              [style.--swatch-color]="a"
              role="radio"
              [attr.aria-checked]="accent() === a"
              (click)="setAccent(a)"
              (keydown.enter)="setAccent(a)"
              (keydown.space)="setAccent(a)"
            >
              <span class="sr-only">{{ a }}</span>
            </button>
          }
        </div>
        <select [value]="themeMode()" (change)="setThemeMode($any($event.target).value)">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="system">System</option>
        </select>
      </label>
      <label>
        <span>Accent</span>
        <input
          type="color"
          [value]="accent() || '#7c3aed'"
          (input)="setAccent($any($event.target).value)"
        />
      </label>
      <label>
        <span>Density</span>
        <select [value]="density()" (change)="setDensity($any($event.target).value)">
          <option value="comfortable">Comfortable</option>
          <option value="compact">Compact</option>
        </select>
      </label>
      <label>
        <span>Contrast</span>
        <select
          [value]="highContrast() ? 'high' : 'standard'"
          (change)="setHighContrast($any($event.target).value === 'high')"
        >
          <option value="standard">Standard</option>
          <option value="high">High</option>
        </select>
      </label>
    </fieldset>
    <fieldset class="group">
      <legend>Data</legend>
      <div class="data-actions">
        <button type="button" class="btn-base btn-ghost" (click)="exportData()">
          Export my data
        </button>
        <label class="btn-base btn-ghost" style="cursor:pointer">
          Import data
          <input type="file" accept=".txt" style="display:none" (change)="importData($event)" />
        </label>
      </div>
      @if (exportStatus()) {
        <p class="export-status" role="status" aria-live="polite">{{ exportStatus() }}</p>
      }
      <p class="hint">Export saves a backup to your device. Import restores from a backup made on this device.</p>
    </fieldset>
  </form>
</section>
