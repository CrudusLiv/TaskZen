<section class="page-settings panel-stack">
  <header class="heading panel-glass panel-section">
    <h1>Settings</h1>
    <p class="intro">Personalization shell (no persistence wired yet).</p>
  </header>
  <form class="prefs panel-glass panel-section" (submit)="$event.preventDefault()">
    <fieldset class="group">
      <legend>Interface</legend>
      <label class="inline">
        <input type="checkbox" [checked]="calm()" (change)="toggleCalm()" /> Calm mode
      </label>
      <label>
        <span>Theme Mode</span>
        <div class="accent-swatches" role="radiogroup" aria-label="Accent color choices">
          <button
            type="button"
            *ngFor="let a of accentPalette"
            class="swatch"
            [class.active]="accent() === a"
            [style.--swatch-color]="a"
            role="radio"
            [attr.aria-checked]="accent() === a"
            (click)="setAccent(a)"
            (keydown.enter)="setAccent(a)"
            (keydown.space)="setAccent(a)"
          >
            <span class="sr-only">{{ a }}</span>
          </button>
        </div>
        <select [value]="themeMode()" (change)="setThemeMode($any($event.target).value)">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="system">System</option>
        </select>
      </label>
      <label>
        <span>Accent</span>
        <input
          type="color"
          [value]="accent() || '#7c3aed'"
          (input)="setAccent($any($event.target).value)"
        />
      </label>
      <label>
        <span>Density</span>
        <select [value]="density()" (change)="setDensity($any($event.target).value)">
          <option value="comfortable">Comfortable</option>
          <option value="compact">Compact</option>
        </select>
      </label>
      <label>
        <span>Contrast</span>
        <select
          [value]="highContrast() ? 'high' : 'standard'"
          (change)="setHighContrast($any($event.target).value === 'high')"
        >
          <option value="standard">Standard</option>
          <option value="high">High</option>
        </select>
      </label>
    </fieldset>
  </form>
</section>
