<div
  class="shell"
  [class.open]="sidebarOpen()"
  [class.calm]="calmMode()"
  [class.nav-collapsed]="collapsed()"
>
  <app-error-notification-banner />
  <aside class="nav" role="navigation" aria-label="Primary" [attr.aria-expanded]="!collapsed()">
    <div class="brand" aria-label="App brand">TaskZen</div>
    <button
      type="button"
      class="collapse-btn btn-ghost btn-base"
      (click)="toggleCollapse()"
      aria-label="Toggle collapse navigation"
      [attr.aria-pressed]="collapsed()"
    >
      {{ collapsed() ? '›' : '‹' }}
    </button>
    <div class="nav-glass">
      <div
        class="indicator"
        [style.transform]="'translateY(' + activeIndex() * (itemHeight + gap) + 'px)'"
      ></div>
      <nav>
        <a
          *ngFor="let l of nav; let i = index"
          [routerLink]="l.path"
          routerLinkActive="active"
          (click)="toggle()"
          [attr.data-index]="i"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="l.icon" /></svg>
          <span>{{ l.label }}</span>
        </a>
      </nav>
    </div>
    <div class="nav-footer">
      <button
        class="calm-toggle"
        type="button"
        (click)="toggleCalm()"
        aria-pressed="{{ calmMode() }}"
        aria-label="Toggle calm mode"
      >
        <span class="dot" [class.on]="calmMode()"></span>
        Calm Mode
      </button>
    </div>
  </aside>
  <div class="main">
    <div class="content" role="main">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
