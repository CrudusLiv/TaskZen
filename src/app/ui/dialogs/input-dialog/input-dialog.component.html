<section class="dialog-card" role="dialog" aria-modal="true">
  <header>
    <h2>{{ data.title || 'Enter value' }}</h2>
  </header>
  <label>
    <span>{{ data.label || 'Value' }}</span>
    <input type="text" [(ngModel)]="val" [placeholder]="data.placeholder || ''" (keydown.enter)="submit()" />
  </label>
  <footer>
    <button class="btn secondary" type="button" (click)="close()">{{ data.cancelText || 'Cancel' }}</button>
    <button class="btn" type="button" (click)="submit()">{{ data.confirmText || 'Save' }}</button>
  </footer>
</section>
