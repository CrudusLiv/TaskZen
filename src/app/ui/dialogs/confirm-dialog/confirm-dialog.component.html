<section class="dialog-card" role="dialog" aria-modal="true">
  <header>
    <h2>{{ data.title || 'Confirm' }}</h2>
  </header>
  <p>{{ data.message || 'Are you sure?' }}</p>
  <footer>
    <button class="btn secondary" type="button" (click)="no()">{{ data.cancelText || 'Cancel' }}</button>
    <button class="btn danger" type="button" (click)="yes()">{{ data.confirmText || 'Delete' }}</button>
  </footer>
</section>
