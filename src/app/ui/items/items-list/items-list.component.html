<section class="list panel-stack" aria-label="Items list">
  <header
    class="panel-glass panel-section"
    style="display: flex; align-items: center; justify-content: space-between; gap: 1rem"
  >
    <h1 style="margin: 0">Items</h1>
    <a routerLink="/" class="btn-base btn-ghost" style="text-decoration: none">Capture</a>
  </header>
  <div class="filters panel-glass panel-section" *ngIf="allTags().length || search()">
    <div
      class="filter-line"
      style="display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center"
    >
      <input
        type="text"
        class="input"
        placeholder="Search title, description, tags..."
        style="flex: 1; min-width: 14rem"
        [value]="search()"
        (input)="search.set(($any($event.target).value || '').slice(0, 120))"
        aria-label="Search items"
      />
      <button
        type="button"
        class="btn-base btn-ghost"
        (click)="clearFilters()"
        *ngIf="search() || selectedTags().size"
        aria-label="Clear filters"
      >
        Clear
      </button>
    </div>
    <div class="tag-cloud" *ngIf="allTags().length">
      <button
        type="button"
        class="tag-chip"
        *ngFor="let t of allTags()"
        [class.active]="isTagActive(t)"
        (click)="toggleTag(t)"
        aria-pressed="{{ isTagActive(t) ? 'true' : 'false' }}"
      >
        {{ t }}
      </button>
    </div>
    <p class="active-filters" *ngIf="selectedTags().size">
      Filtering by:
      <span class="tag-chip active" *ngFor="let t of tagList()">{{ t }}</span>
    </p>
  </div>
  <div class="group panel-glass panel-section" *ngFor="let status of statuses">
    <h2>{{ status }}</h2>
    <ul>
      <li
        *ngFor="let it of byStatus(status)"
        [class.done]="it.status === 'done'"
        tabindex="0"
        (keydown)="onKey($event, it)"
      >
        <button
          class="status"
          [ngClass]="'status-' + it.status"
          (click)="cycle(it)"
          aria-label="Change status (current: {{ it.status }})"
        >
          {{ it.status }}
        </button>
        <span class="title">{{ it.title }}</span>
        <small *ngIf="it.estimateMinutes">~{{ it.estimateMinutes }}m</small>
        <button
          class="enrich btn-ghost btn-base"
          (click)="toggleEnrich(it)"
          aria-label="Enrich item"
        >
          ⚙
        </button>
        <button class="del" (click)="remove(it.id)" aria-label="Delete item">
          ×<span class="sr-only"> Delete {{ it.title }}</span>
        </button>
        <div
          class="enrich-drawer panel-glass"
          *ngIf="enrichingId() === it.id"
          role="dialog"
          aria-label="Enrich item"
        >
          <div class="enrich-content">
            <h3 id="enrich-head-{{ it.id }}">Enrich</h3>
            <label>
              Estimate (m)
              <input
                type="number"
                class="input"
                [value]="it.estimateMinutes || ''"
                (change)="updateNumber(it, 'estimateMinutes', $event)"
                aria-label="Estimate in minutes"
              />
            </label>
            <label>
              Energy (1-5)
              <input
                type="number"
                class="input"
                [value]="it.energyLevel || ''"
                min="1"
                max="5"
                (change)="updateNumber(it, 'energyLevel', $event)"
                aria-label="Energy level 1 to 5"
              />
            </label>
            <label>
              Effort (1-5)
              <input
                type="number"
                class="input"
                [value]="it.effort || ''"
                min="1"
                max="5"
                (change)="updateNumber(it, 'effort', $event)"
                aria-label="Effort level 1 to 5"
              />
            </label>
            <label>
              Context / Why
              <input
                type="text"
                class="input"
                [value]="it.contextNote || ''"
                (change)="updateField(it, 'contextNote', $any($event.target).value)"
                placeholder="Reason or background"
                aria-label="Context or why"
              />
            </label>
            <label>
              Micro-steps (comma)
              <input
                type="text"
                class="input"
                placeholder="draft, outline"
                (change)="updateMicroSteps(it, $event)"
                [value]="(it.microSteps || []).join(', ')"
                aria-label="Micro steps comma separated"
              />
            </label>
            <label>
              Routine Link
              <input
                type="text"
                class="input"
                placeholder="routine id"
                [value]="it.routineId || ''"
                (change)="updateField(it, 'routineId', ($any($event.target).value || '').trim())"
                aria-label="Routine identifier"
              />
            </label>
            <div class="actions">
              <button type="button" class="btn-base btn-ghost" (click)="closeEnrich()">
                Close
              </button>
            </div>
          </div>
        </div>
      </li>
    </ul>
  </div>
  <p *ngIf="!order().length" class="empty">No items yet.</p>
  <div class="sr-only" aria-live="polite">{{ liveMsg() }}</div>
</section>
