name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          if npm run -q lint; then
            echo "lint ok"
          else
            echo "no lint script, skipping"
          fi

      - name: Run unit tests
        run: |
          npx playwright install-deps || true
          npm test -- --watch=false --browsers=ChromeHeadless || npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Build
        run: npm run build --if-present
