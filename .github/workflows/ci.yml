name: CI

on:
  push:
    branches: [TaskZen]
  pull_request:
    branches: [TaskZen]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage
        env:
          CI: 'true'

      - name: Build (prod)
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-taskzen
          path: dist/TaskZen
          if-no-files-found: error

  e2e:
    if: github.ref == 'refs/heads/TaskZen' && github.event_name == 'push'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run e2e
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  preview-deploy:
    if: github.ref == 'refs/heads/TaskZen' && github.event_name == 'push'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Firebase Preview Deploy
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ] && [ -n "$FIREBASE_PROJECT" ]; then
            npx firebase-tools hosting:channel:deploy ci-${{ github.run_id }} --project "$FIREBASE_PROJECT" || echo "Preview deploy failed"
          else
            echo "Preview deploy skipped (missing FIREBASE_TOKEN or FIREBASE_PROJECT)"
          fi
